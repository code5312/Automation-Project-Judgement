# IPC 규칙 설정 (docs/PIPELINE.md 단계 2).
# 읽는 쪽: src/ipauto/scoring/rules.py, 사용하는 쪽: src/ipauto/scoring/ipc.py,
# src/ipauto/scoring/keywords.py

families: ["H01M", "B60L"]

# 어느 개념 그룹이 어느 IPC 패밀리와 연결되는지(점수 보조용 매핑).
# concepts.yaml의 concept_groups 키와 이름이 맞아야 한다.
concept_family_map:
  battery: H01M
  vehicle: B60L

# 주 신호: 확정된 세부 IPC 서브그룹 범위. H01M 10/60~10/667("Heating or
# cooling; Temperature control")이 배터리 열관리의 정확한 범위임을
# WIPO(IPC) 2026.01 scheme/USPTO CPC definition(H01M10/60=온도 제어,
# H01M10/613=냉각, H01M10/625=차량용, ... H01M10/667=끝, 다음은
# H01M12/00)로 2026-10-01에 교차 확인했다(docs/OPEN_QUESTIONS.md).
# 슬래시 뒤 숫자는 소수로 비교한다(IPC 자체가 그렇게 정렬되므로):
# "613" -> 0.613, "6235" -> 0.6235.
primary_signals:
  - family: H01M
    group: "10"
    min_subgroup: 0.60
    max_subgroup: 0.667
    concept: cooling
