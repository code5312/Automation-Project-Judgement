<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사람판단 주제 검토 실험</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#16202d;background:#f4f6fa}body{margin:0 auto;max-width:1100px;padding:24px}
h1{margin:0 0 8px}p{line-height:1.55}.note{background:#fff4d8;border-left:4px solid #b77700;padding:12px 16px;margin:16px 0}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}select,input,button,textarea{font:inherit;padding:8px;border:1px solid #b7c2d1;border-radius:6px}
button{background:#173f77;color:white;cursor:pointer;border:0}.card{background:white;border:1px solid #dce2e9;border-radius:10px;padding:16px;margin:12px 0}
.candidate{border-left:5px solid #326dba}.meta{font-size:.9rem;color:#50627a}.text{white-space:pre-wrap;margin:8px 0}
.choices{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.choices label{white-space:nowrap}.reason{width:98%;min-height:42px}
.after{background:#f6f8fb;padding:8px;border-radius:5px}h2{margin-top:32px}
</style></head><body>
<h1>사람판단 주제 검토 실험</h1>
<p>같은 저장소에서 B-3 변경 완료 검증과 D IP 검토 요청 후보를 살펴보는 작은 실험 화면입니다.</p>
<div class="note"><strong>팀 제작 가상 사례입니다.</strong> 시스템의 추천은 정답이 아닙니다. IP 항목은 법률 판단이 아니라 추가 검토가 필요한지 표시해 주세요. 입력 내용은 서버로 전송되지 않으며, 마지막에 JSON 파일을 내려받아 직접 공유해야 합니다.</div>
<div class="controls"><label>사례 <select id="case"></select></label><label>검토자 별칭 <input id="reviewer" placeholder="예: reviewer-1"></label><button id="download">판단 기록 내려받기</button></div>
<main id="content"></main>
<script>
const CASES = [{"id": "fixtures.json", "sha256": "a9a115e2bc4b4d86e36182aa6d7536bb265ba96153fce975b2180f0576d13729", "change": "환불 신청 가능 기간을 구매 후 7일에서 14일로 변경한다", "artifacts": [{"id": "policy", "kind": "policy", "before": "환불 신청은 구매 후 7일 이내 가능하다.", "after": "환불 신청은 구매 후 14일 이내 가능하다.", "suggested": true}, {"id": "faq", "kind": "faq", "before": "구매 후 일주일이 지나면 환불 요청을 받지 않습니다.", "after": "구매 후 14일까지 환불 요청을 받습니다.", "suggested": true}, {"id": "cs_macro", "kind": "cs", "before": "고객님, 취소 또는 환불은 결제일로부터 7일 안에 신청해 주세요.", "after": "고객님, 취소 또는 환불은 결제일로부터 7일 안에 신청해 주세요.", "suggested": false}, {"id": "refund_config", "kind": "config", "before": "refund_window_days: 7", "after": "refund_window_days: 14", "suggested": false}, {"id": "refund_test", "kind": "test", "before": "assert refund_allowed(days_since_purchase=7); assert not refund_allowed(days_since_purchase=8)", "after": "assert refund_allowed(days_since_purchase=14); assert not refund_allowed(days_since_purchase=15)", "suggested": false}, {"id": "release_check", "kind": "checklist", "before": "출시 전 환불 기간 안내 문구와 자동화 규칙을 대조한다.", "after": "출시 전 환불 기간 안내 문구와 자동화 규칙을 대조한다.", "suggested": true}, {"id": "delivery_policy", "kind": "policy", "before": "배송 지연 보상은 발송 후 7일 기준으로 계산한다.", "after": "배송 지연 보상은 발송 후 7일 기준으로 계산한다.", "suggested": true}, {"id": "account_faq", "kind": "faq", "before": "계정 삭제 요청은 7일 동안 철회할 수 있습니다.", "after": "계정 삭제 요청은 7일 동안 철회할 수 있습니다.", "suggested": true}, {"id": "membership_config", "kind": "config", "before": "trial_days: 14", "after": "trial_days: 14", "suggested": false}, {"id": "privacy_doc", "kind": "policy", "before": "결제정보 보존 기간은 5년입니다.", "after": "결제정보 보존 기간은 5년입니다.", "suggested": false}, {"id": "return_shipping", "kind": "faq", "before": "반품 배송비는 환불액에서 공제됩니다.", "after": "반품 배송비는 환불액에서 공제됩니다.", "suggested": false}, {"id": "analytics_test", "kind": "test", "before": "assert daily_refund_report_exists()", "after": "assert daily_refund_report_exists()", "suggested": true}], "release": "제품 v3.2 외부 공개 예정", "events": [{"id": "ip01", "text": "새로운 사용자 행동 예측 캐시 엔진을 제품에 추가했다.", "record": "none", "premise": "", "suggested": true}, {"id": "ip02", "text": "관리자 화면의 버튼 색상과 간격을 조정했다.", "record": "none", "premise": "", "suggested": false}, {"id": "ip03", "text": "기존 서버 내부 추천 기술을 외부 SDK에 공개한다.", "record": "trade_secret", "premise": "서버 내부에서만 동작하고 외부에 구현이 노출되지 않는다", "suggested": true}, {"id": "ip04", "text": "이미 검토 완료한 압축 알고리즘의 설명 문구를 수정했다.", "record": "patent_reviewed", "premise": "", "suggested": false}, {"id": "ip05", "text": "고객 단말용 라이브러리에 내부 최적화 로직을 포함한다.", "record": "trade_secret", "premise": "서버 내부에서만 동작하고 외부에 구현이 노출되지 않는다", "suggested": false}, {"id": "ip06", "text": "새 분석 모델을 출시 버전에 탑재한다.", "record": "none", "premise": "", "suggested": true}, {"id": "ip07", "text": "새 결제 아이콘을 추가한다.", "record": "none", "premise": "", "suggested": false}, {"id": "ip08", "text": "검토 완료된 검색 기능의 오류 메시지를 고쳤다.", "record": "patent_reviewed", "premise": "", "suggested": false}, {"id": "ip09", "text": "성능 향상을 위해 요청 순서를 바꿨다.", "record": "none", "premise": "", "suggested": false}, {"id": "ip10", "text": "신규 센서 융합 알고리즘을 논문 초록에 공개한다.", "record": "none", "premise": "", "suggested": true}, {"id": "ip11", "text": "내부 운영 대시보드의 표 정렬을 수정했다.", "record": "none", "premise": "", "suggested": false}, {"id": "ip12", "text": "기존 영업비밀 처리 로직을 오픈소스 저장소에 게시한다.", "record": "trade_secret", "premise": "외부에 코드를 공개하지 않는다", "suggested": true}]}, {"id": "fixtures_followup.json", "sha256": "202b93483704b90446783f6bf103ae61266f087c1b682f4cf1180846f11ca9dd", "change": "무료배송 적용 기준을 주문 금액 5만원에서 3만원으로 낮춘다", "artifacts": [{"id": "shipping_policy", "kind": "policy", "before": "무료배송은 주문 금액 5만원 이상부터 적용한다.", "after": "무료배송은 주문 금액 3만원 이상부터 적용한다.", "suggested": true}, {"id": "delivery_faq", "kind": "faq", "before": "오만 원 이상 주문하면 배송비를 받지 않습니다.", "after": "삼만 원 이상 주문하면 배송비를 받지 않습니다.", "suggested": true}, {"id": "shipping_config", "kind": "config", "before": "free_shipping_min_krw: 50000", "after": "free_shipping_min_krw: 30000", "suggested": true}, {"id": "shipping_test", "kind": "test", "before": "assert shipping_fee(50000) == 0", "after": "assert shipping_fee(50000) == 0", "suggested": false}, {"id": "cs_delivery", "kind": "cs", "before": "배송비 면제 기준은 5만원입니다.", "after": "배송비 면제 기준은 3만원입니다.", "suggested": true}, {"id": "refund_policy", "kind": "policy", "before": "환불 처리 기간은 5일이다.", "after": "환불 처리 기간은 5일이다.", "suggested": true}, {"id": "vip_shipping", "kind": "faq", "before": "VIP 고객은 금액과 무관하게 무료배송입니다.", "after": "VIP 고객은 금액과 무관하게 무료배송입니다.", "suggested": false}, {"id": "payment_limit", "kind": "config", "before": "max_payment_krw: 50000", "after": "max_payment_krw: 50000", "suggested": true}], "release": "제품 v3.3 외부 공개 예정", "events": [{"id": "q01", "text": "새 추천 엔진을 공개 버전에 탑재한다.", "record": "none", "premise": "", "suggested": true}, {"id": "q02", "text": "서버 비공개 규칙을 고객용 플러그인에 포함한다.", "record": "trade_secret", "premise": "서버 내부에서만 사용", "suggested": false}, {"id": "q03", "text": "새 고객 안내 배너를 추가한다.", "record": "none", "premise": "", "suggested": false}, {"id": "q04", "text": "이미 검토한 기술의 문서 오탈자를 고친다.", "record": "patent_reviewed", "premise": "", "suggested": false}, {"id": "q05", "text": "새로운 데이터 정합성 방법을 학회 발표자료에 싣는다.", "record": "none", "premise": "", "suggested": false}, {"id": "q06", "text": "고객 센터의 운영시간 표시를 바꾼다.", "record": "none", "premise": "", "suggested": false}, {"id": "q07", "text": "내부 전용 모델을 공개 API 응답에 포함한다.", "record": "trade_secret", "premise": "외부에 구현이 노출되지 않음", "suggested": false}, {"id": "q08", "text": "기존 알고리즘의 내부 로그 형식만 바꾼다.", "record": "patent_reviewed", "premise": "", "suggested": false}]}];
const sel=document.getElementById('case'), content=document.getElementById('content');
const startedAt=new Date().toISOString();
const decisions={};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pickKey(type,id){return `${sel.value}:${type}:${id}`;}
function card(type,row,detail){
  const key=pickKey(type,row.id), saved=decisions[key]||{};
  const options=['영향/검토 필요','해당 없음','판단 보류'];
  return `<section class="card ${row.suggested?'candidate':''}" data-key="${escapeHtml(key)}"><strong>${escapeHtml(row.id)}</strong> <span class="meta">${escapeHtml(detail)} · 시스템 후보: ${row.suggested?'예':'아니오'}</span>
  <div class="text">${escapeHtml(type==='change'?row.before:row.text)}</div>
  ${type==='change'?`<details><summary>수정 후 내용 보기</summary><div class="after">${escapeHtml(row.after)}</div></details>`:''}
  ${type==='ip'&&row.premise?`<div class="meta">이전 판단 전제: ${escapeHtml(row.premise)}</div>`:''}
  <div class="choices">${options.map((v,i)=>`<label><input type="radio" name="${escapeHtml(key)}" value="${i}" ${saved.choice===String(i)?'checked':''}>${v}</label>`).join('')}</div>
  <textarea class="reason" placeholder="판단 이유 또는 추가 확인할 정보">${escapeHtml(saved.reason||'')}</textarea></section>`;
}
function saveVisible(){document.querySelectorAll('.card').forEach(el=>{const key=el.dataset.key;const choice=el.querySelector('input[type=radio]:checked');const reason=el.querySelector('textarea').value; if(choice||reason)decisions[key]={choice:choice?.value??null,reason};});}
function render(){const c=CASES.find(x=>x.id===sel.value);content.innerHTML=`<h2>B-3 · ${escapeHtml(c.change)}</h2><p>변경 영향을 받는 자료인지 판단하세요. 수정 후 내용은 영향 여부를 정한 뒤 열어보세요.</p>`+
 c.artifacts.map(x=>card('change',x,x.kind)).join('')+
 `<h2>D · ${escapeHtml(c.release)}</h2><p>IP 담당자에게 검토 요청할 사건인지 판단하세요.</p>`+
 c.events.map(x=>card('ip',x,x.record)).join('');}
CASES.forEach(c=>sel.add(new Option(c.id,c.id))); sel.addEventListener('change',()=>{saveVisible();render();});render();
document.getElementById('download').addEventListener('click',()=>{saveVisible();const result={schema:'topic-review-v1',reviewer:document.getElementById('reviewer').value||'anonymous',started_at:startedAt,exported_at:new Date().toISOString(),cases:CASES.map(c=>({id:c.id,sha256:c.sha256})),decisions};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`topic-review-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
</script></body></html>
