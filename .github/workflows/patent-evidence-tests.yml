name: patent-evidence-tests

on:
  push:
    branches: [juneok]
    paths:
      - "patent-evidence-poc/**"
      - ".github/workflows/patent-evidence-tests.yml"
  pull_request:
    paths:
      - "patent-evidence-poc/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patent-evidence-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run fixture baseline
        run: |
          python -m src.patent_evidence.cli             --corpus data/corpus_fixture.jsonl             --eval data/eval_fixture.jsonl             --out output
