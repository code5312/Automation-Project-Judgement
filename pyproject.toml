[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ipauto"
version = "0.1.0"
description = "Human-centered IP judgment automation (KIPRIS retrieval, scoring, judgment ledger)"
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.64.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[project.scripts]
ipauto = "ipauto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipauto = ["db/schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
